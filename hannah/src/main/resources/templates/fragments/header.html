<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:fragment="header">
      <header class="header">
        <div class="nav-container">
          <a th:href="@{/}" class="logo">Hannah</a>
          <nav class="nav-menu">
            <a th:href="@{/courses}">Khóa học</a>
            <a th:href="@{/documents}">Tài liệu</a>
            <a th:href="@{/community}">Cộng đồng</a>
            <a th:href="@{/support}">Trợ giúp</a>
            <a th:href="@{/about}">Về chúng tôi</a>
          </nav>
          <div th:unless="${session.user != null}" class="auth-buttons">
            <a th:href="@{/login}" class="btn btn-secondary">Đăng nhập</a>
            <a th:href="@{/register}" class="btn btn-secondary">Đăng ký</a>
          </div>
          <div
            th:if="${session.user != null}"
            class="user-dropdown"
            onclick="toggleDropdown()"
          >
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            <div class="user-name">
              <div th:if="${session.user != null}" class="user-info">
                <span th:text="${session.user.hoTen}">Tên người dùng</span>
              </div>

              <i class="fa-solid fa-caret-down"></i>
            </div>
            <div class="dropdown-menu" id="userDropdown">
              <a th:href="@{/user-profile}"
                ><i class="fas fa-user-cog"></i> Quản lý tài khoản</a
              >
              <a th:href="@{/user-dashboard}"
                ><i class="fa-solid fa-book-open"></i> Học tập</a
              >
              <a th:href="@{/logout}"
                ><i class="fas fa-sign-out-alt"></i> Đăng xuất</a
              >
            </div>
          </div>
        </div>
      </header>
      <script>
        function toggleDropdown() {
          const dropdown = document.getElementById("userDropdown");
          dropdown.classList.toggle("show");
        }
        window.onclick = function (event) {
          if (!event.target.closest(".user-dropdown")) {
            const dropdown = document.getElementById("userDropdown");
            dropdown.classList.remove("show");
          }
        };
      </script>
    </div>
  </body>
</html>
