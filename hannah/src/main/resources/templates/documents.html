<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hannah - Tài liệu</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/documents.css}" />
  </head>
  <body>
   <div th:replace="fragments/header :: header"></div>
    <section class="documents-hero">
      <div class="container">
        <h1>Thư viện tài liệu</h1>
        <p>
          Khám phá kho tàng tài liệu phong phú với slide bài giảng, code mẫu,
          bài tập và nhiều tài nguyên học tập khác
        </p>
      </div>
    </section>

    <section class="main-content">
      <div class="container">
        <div class="content-layout">
          <div class="sidebar">
            <h3 class="sidebar-title">Bộ lọc</h3>

            <div class="filter-group">
              <label class="filter-label">Loại tài liệu</label>
              <ul class="filter-list">
                <li class="filter-item" th:classappend="${selectedLoaiTaiLieuId == null || selectedLoaiTaiLieuId == 0} ? 'active' : ''">
                  <a th:href="@{/documents(loaiTaiLieuId=0)}">Tất cả</a>
                </li>
                <li class="filter-item" th:each="loai : ${loaiTaiLieuOptions}" th:classappend="${selectedLoaiTaiLieuId == loai.maLoaiTaiLieu} ? 'active' : ''">
                  <a th:href="@{/documents(loaiTaiLieuId=${loai.maLoaiTaiLieu})}" th:text="${loai.tenLoai}">Tên Loại</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="documents-grid">
            <div class="document-card" th:each="taiLieu : ${taiLieuList}">
                <div class="document-preview">
                    <i class="fas fa-file-alt"></i>
                    <div class="document-type-badge" th:text="${taiLieu.loaiTaiLieu.tenLoai}">PDF</div>
                </div>
                <div class="document-content">
                    <h3 class="document-title" th:text="${taiLieu.tenTaiLieu}">Tên tài liệu</h3>
                    <p class="document-desc" th:text="${taiLieu.moTa}">Mô tả tài liệu</p>
                    <div class="document-meta">
                        <span><i class="fas fa-download"></i> <span th:text="${taiLieu.luotTai}"></span> lượt tải</span>
                        <span><i class="fas fa-star"></i> <span th:text="${taiLieu.danhGia}"></span>/5</span>
                        <span>
                            <i class="fas fa-file"></i>
                            <span th:if="${taiLieu.kichThuoc != null}">
                                <span th:if="${taiLieu.kichThuoc < 1024 * 1024}" th:text="${#numbers.formatDecimal(taiLieu.kichThuoc / 1024.0, 1, 1)} + ' KB'"></span>
                                <span th:if="${taiLieu.kichThuoc >= 1024 * 1024}" th:text="${#numbers.formatDecimal(taiLieu.kichThuoc / (1024.0 * 1024.0), 1, 1)} + ' MB'"></span>
                            </span>
                            <span th:if="${taiLieu.kichThuoc == null}">N/A</span>
                        </span>
                    </div>
                    <div class="document-tags">
                        <span class="document-tag" th:text="${taiLieu.loaiTaiLieu.tenLoai}">Loại</span>
                    </div>
                    <div class="document-actions">
                        <a th:href="@{/documents/open(maTaiLieu=${taiLieu.maTaiLieu})}"
                           class="doc-btn doc-btn-secondary">
                            <i class="fas fa-eye"></i> Mở tài liệu
                        </a>
                        </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div th:replace="fragments/footer :: footer"></div>

    <div th:replace="fragments/chatbox :: chatbox"></div>
    <script th:src="@{/js/chatbox.js}"></script>
    <script th:src="@{/js/pages.js}"></script>
  </body>
</html>
