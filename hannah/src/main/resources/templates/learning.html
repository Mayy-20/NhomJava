<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${course.tenKhoaHoc} + ' - Học tập - Hannah'">
      Học tập
    </title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/documents.css}" />
    <link rel="stylesheet" th:href="@{/css/learning.css}" />
  </head>
  <body>
    <header class="header">
      <div class="nav-container">
        <a href="/hannah" class="logo">Hannah</a>
        <!-- Phần tử để căn giữa tên khóa học -->
        <div class="header-center-title">
          <h2 th:text="${course.tenKhoaHoc}">Tên khóa học</h2>
        </div>
        <!-- Phần tử nhóm các nút và avatar bên phải -->
        <div class="header-right-items">
          <a
            th:href="@{/courses/preview/{id}(id=${course.maKhoaHoc})}"
            class="btn btn-secondary"
            >Quay lại</a
          >
          <div class="auth-buttons">
            <div
              class="user-avatar"
              th:text="${user != null ? #strings.substring(user.hoTen, 0, 1) : 'U'}"
            >
              U
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="course-content">
      <div class="container">
        <div class="content-grid">
          <!-- Cột trái: Danh sách bài học -->
          <div class="lesson-list-column">
            <div class="lesson-section">
              <h2 class="section-title">Danh sách bài học</h2>
              <ul class="lesson-list">
                <li th:each="lesson : ${lessons}" class="lesson-item">
                  <div class="lesson-header">
                    <div class="lesson-info">
                      <a
                        th:href="@{/courses/lesson/{maKhoaHoc}/{maBaiHoc}(maKhoaHoc=${course.maKhoaHoc}, maBaiHoc=${lesson.maBaiHoc})}"
                      >
                        <h3 th:text="${lesson.tenBaiHoc}">Tên bài học</h3>
                      </a>
                    </div>
                    <div class="lesson-meta">
                      <span
                        class="lesson-status"
                        th:if="${tienDoMap != null}"
                        th:classappend="${tienDoMap[lesson.maBaiHoc]?.hoanThanh} ? 'completed' : ''"
                      >
                        <i
                          class="fa-solid fa-check"
                          th:if="${tienDoMap[lesson.maBaiHoc]?.hoanThanh}"
                        ></i>
                      </span>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-content-column">
            <!-- Phần video và thông tin -->
            <div
              class="content-area"
              th:if="${baiHoc != null or currentLesson != null}"
            >
              <div class="video-container">
                <div
                  class="video-placeholder"
                  th:if="${videoEmbedUrl != null and !#strings.isEmpty(videoEmbedUrl)}"
                >
                  <iframe
                    th:src="|${videoEmbedUrl}|"
                    width="100%"
                    height="400"
                    loading="lazy"
                    frameborder="0"
                    allowfullscreen
                  ></iframe>
                </div>
                <div
                  th:if="${videoEmbedUrl == null or #strings.isEmpty(videoEmbedUrl)}"
                >
                  <p>Không có video cho bài học này.</p>
                </div>
                <div class="video-controls">
                  <a
                    th:if="${previousLesson != null}"
                    th:href="@{/courses/lesson/{maKhoaHoc}/{maBaiHoc}(maKhoaHoc=${course.maKhoaHoc}, maBaiHoc=${previousLesson.maBaiHoc})}"
                    class="btn btn-secondary"
                    >Bài trước</a
                  >
                  <a
                    th:if="${nextLesson != null}"
                    th:href="@{/courses/lesson/{maKhoaHoc}/{maBaiHoc}(maKhoaHoc=${course.maKhoaHoc}, maBaiHoc=${nextLesson.maBaiHoc})}"
                    class="btn btn-primary"
                    >Bài tiếp theo</a
                  >
                </div>
              </div>

              <!-- Thông tin bài học chính -->
              <div class="lesson-info-main">
                <h2 th:text="${baiHoc.tenBaiHoc} ?: ${currentLesson.tenBaiHoc}">
                  Tên bài học
                </h2>
                <div class="meta">
                  <span th:text="${course.giangVien.hoTen}">Giảng viên</span>
                  <span th:text="${ngayTaoFormatted}">Ngày tạo</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/chatbox :: chatbox"></div>
    <script th:src="@{/js/chatbox.js}"></script>
    <script th:src="@{/js/pages.js}"></script>
  </body>
</html>
