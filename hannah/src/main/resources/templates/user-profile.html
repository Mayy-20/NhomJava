<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hannah - Quản lí tài khoản</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/community.css}" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/user-profile.css}" />
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragments/header :: header"></div>
    <!-- Main Content -->
    <div class="main-content">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-name" th:text="${nguoiDung.hoTen}"></div>
        <div class="profile-email" th:text="${nguoiDung.email}"></div>
        <div
          class="profile-badge"
          th:text="${nguoiDung.vaiTro.tenVaiTro}"
        ></div>
      </div>

      <!-- Personal Information -->
      <div class="form-section">
        <h1 class="section-title">Thông tin cá nhân</h1>
        <form
          th:action="@{/hannah/user-profile}"
          method="post"
          th:object="${nguoiDung}"
        >
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Họ và tên</label>
              <input
                type="text"
                class="form-input"
                th:field="*{hoTen}"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-input"
                th:field="*{email}"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Số điện thoại</label>
              <input type="tel" class="form-input" th:field="*{dienThoai}" />
            </div>
            <div class="form-group">
              <label class="form-label">Ngày đăng ký </label>
              <input
                type="date"
                class="form-input"
                th:value="${#temporals.format(nguoiDung.ngayTao, 'yyyy-MM-dd')}"
                readonly
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Giới thiệu bản thân</label>
            <textarea class="form-textarea" th:field="*{gioiThieu}"></textarea>
          </div>
          <div class="form-actions">
            <a th:href="@{/hannah/user-profile}" class="btn btn-secondary"
              >Hủy</a
            >
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i>
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </div>
    <script th:inline="javascript">
      /*<![CDATA[*/
      let successMessage = /*[[${successMessage}]]*/ null;
      if (successMessage) {
        alert(successMessage);
      }
      /*]]>*/
    </script>
    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
    <script th:src="@{/js/pages.js}"></script>
  </body>
</html>
