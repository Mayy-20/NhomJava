<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hannah - Trang chủ</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/community.css}" />
    <link rel="stylesheet" th:href="@{/css/document.css}" />
    <link rel="stylesheet" th:href="@{/css/learning.css}" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/user-profile.css}" />
    <link rel="stylesheet" th:href="@{/css/user-dashboard.css}" />
  </head>
  <body>
    <div th:replace="fragments/header :: header"></div>

    <div class="main-content">
      <div class="welcome-section">
        <h1 th:text="'Chào mừng trở lại, ' + ${hoTenNguoiDung} + ' 👋'"></h1>
        <p>Hãy tiếp tục hành trình học tập của bạn. Bạn đang làm rất tốt!</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-book-open"></i>
          </div>
          <div class="stat-number" th:text="${coursesInProgress}">0</div>
          <div class="stat-label">Khóa học đang học</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-trophy"></i>
          </div>
          <div class="stat-number" th:text="${completedLessons}">0</div>
          <div class="stat-label">Bài học hoàn thành</div>
        </div>
      </div>

      <div class="content-grid">
        <div class="main-panel">
          <div class="card">
            <h2 class="card-title">Khóa học của tôi</h2>
            <div class="course-list">
              <div
                class="course-item"
                th:each="course : ${userCourses}"
                th:if="${course != null and course.maKhoaHoc != null}"
              >
                <img
                  th:src="${course.hinhAnh != null ? course.hinhAnh : '/images/default-course.jpg'}"
                  alt="Ảnh khóa học"
                  class="course-image"
                />

                <div class="course-info">
                  <div class="course-title" th:text="${course.tenKhoaHoc}">
                  
                  </div>

                  <div class="course-progress">
                    <div class="progress-bar">
                      <div
                        class="progress-fill"
                        th:style="'width: ' + (${course.phanTramHoanThanh} != null ? ${course.phanTramHoanThanh} : 0) + '%'"
                      ></div>
                    </div>
                    <span
                      class="progress-text"
                      th:text="(${course.phanTramHoanThanh} != null ? ${course.phanTramHoanThanh} : 0) + '%'"
                    >
                      0%
                    </span>
                  </div>

                  <div
                    class="course-meta"
                    th:text="'Giảng viên: ' + (${course.tenGiangVien} != null ? ${course.tenGiangVien} : 'Không rõ') + ' • ' + ${course.soBaiHocDaHoanThanh} + '/' + ${course.tongSoBaiHoc} + ' bài học'"
                  >
                    Giảng viên: Nguyễn Văn A • 0/0 bài học
                  </div>
                </div>

                <div class="course-actions">
                  <a
                    th:href="@{'/courses/start/' + ${course.maKhoaHoc}}"
                    class="btn btn-primary"
                    >Học ngay</a
                  >
                  <a
                    th:href="@{'/courses/preview/' + ${course.maKhoaHoc}}"
                    class="btn btn-secondary"
                    >Chi tiết</a
                  >
                </div>
              </div>
              <p th:if="${#lists.isEmpty(userCourses)}">
                Bạn chưa đăng ký khóa học nào.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    <script th:src="@{/js/pages.js}"></script>
  </body>
</html>
