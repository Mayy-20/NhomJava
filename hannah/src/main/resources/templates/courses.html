<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hannah - Khóa học</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/documents.css}" />
  </head>
  <body>
    <div th:replace="fragments/header :: header"></div>

    <section class="courses-hero">
      <div class="container">
        <h1>Khóa học của chúng tôi</h1>
        <p>
          Khám phá các khóa học lập trình chất lượng cao được thiết kế để giúp
          bạn thành công trong sự nghiệp công nghệ
        </p>
      </div>
    </section>

    <section class="course-categories">
      <div class="container">
        <h2 class="section-title">Danh mục khóa học</h2>
      </div>
      <div class="container">
        <div class="category-tabs">
          <button
            th:each="topic : ${topics}"
            class="tab-btn"
            th:classappend="${selectedTopic == topic.maChuDe} ? 'active' : ''"
            th:onclick="'window.location.href=\'' + @{/courses/filter(topic=${topic.maChuDe})} + '\''"
            th:text="${topic.tenChuDe}"
          >
            Chủ đề
          </button>
        </div>
      </div>
    </section>

    <!-- Course List -->
    <section class="course-list">
      <div class="container">
        <div class="course-grid">
          <div
            th:each="course : ${courses}"
            class="course-card"
            th:onclick="'window.location.href=\'' + @{/course-detail(id=${course.maKhoaHoc})} + '\''"
          >
            <div class="course-image">
              <img
                th:src="${course.hinhAnh}"
                alt="Ảnh khóa học"
                class="course-image"
              />
              <div
                class="course-level"
                th:text="${course.trangThai == 'HoatDong' ? 'Cơ bản' : course.trangThai == 'ChoDuyet' ? 'Trung cấp' : 'Nâng cao'}"
              >
                Cấp độ
              </div>
            </div>
            <div class="course-content">
              <h3 class="course-title" th:text="${course.tenKhoaHoc}">
                Tên khóa học
              </h3>
              <p class="course-desc" th:text="${course.moTa}">Mô tả khóa học</p>
              <div class="course-meta">
                <span><i class="fas fa-clock"></i>10 giờ</span>
                <span class="course-rating">
                  <i class="fas fa-star"></i>
                  <span
                    th:text="${course.danhGiaTB != null ? course.danhGiaTB : 'Chưa có đánh giá'}"
                    >4.8</span
                  >
                </span>
              </div>
              <div class="course-actions">
                <a
                  th:href="@{/course-detail(id=${course.maKhoaHoc})}"
                  class="btn-course btn-course-primary"
                  >Học ngay</a
                >
                <a
                  th:href="@{/course-detail(id=${course.maKhoaHoc})}"
                  class="btn-course btn-course-secondary"
                  >Xem trước</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/chatbox :: chatbox"></div>
    <script th:src="@{/js/chatbox.js}"></script>
    <script th:src="@{/js/pages.js}"></script>
  </body>
</html>
