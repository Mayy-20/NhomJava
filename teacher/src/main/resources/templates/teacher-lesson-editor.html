<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Bài học - Hannah</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="header">
    <div class="nav-container">
        <div class="logo">Hannah</div>
        <ul class="nav-menu">
            <li><a th:href="@{/teacher-dashboard}">Trang chủ</a></li>
            <li><a th:href="@{/teacher-courses}">Khóa học</a></li>
            <li><a th:href="@{/students/list}">Học viên</a></li>
            <li><a th:href="@{/analytics}">Thống kê</a></li>
            <li><a th:href="@{/teacher-community}">Cộng đồng</a></li>
            <li><a th:href="@{/profile}">Hồ sơ</a></li>
            <li><a th:href="@{/teacher-settings}">Cài đặt</a></li>
            <li><a th:href="@{/logout}" class="nav-logout">Đăng xuất</a></li>
        </ul>
        <div class="user-profile">
            <div class="user-badge">Giáo viên</div>
            <div class="user-avatar">GV</div>
            <div class="user-name">Nguyễn Văn A</div>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Chỉnh sửa Bài học</h1>
            <p>Quản lý nội dung và tài nguyên khóa học</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/teacher-course-details}" class="btn btn-secondary">Hủy</a>
            <button type="submit" class="btn btn-primary" form="lessonForm">Lưu Bài học</button>
             <a href="#" class="btn btn-danger" id="deleteLessonButton" onclick="showDeleteModal('Tên bài học sẽ hiện ở đây')">Xóa bài học</a>
        </div>
    </div>

    <form id="lessonForm" th:action="@{/save}" th:object="${lesson}" method="post" enctype="multipart/form-data">
        <div class="card">
            <h2 class="card-title">Thông tin bài học</h2>
            <div class="form-group">
                <label class="form-label">Tiêu đề</label>
                <input type="text" th:field="*{title}" class="form-input" placeholder="Nhập tiêu đề bài học..." required>
            </div>
            <div class="form-group">
                <label class="form-label">Chương</label>
                <input type="text" th:field="*{chapter}" class="form-input" placeholder="Ví dụ: Chương 1: Giới thiệu Python" required>
            </div>
            <div class="form-group">
                <label class="form-label">Khóa học</label>
                <select th:field="*{course.id}" name="courseId" class="form-select" required>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.title}"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Nội dung</label>
                <textarea th:field="*{content}" class="form-input" rows="10" placeholder="Nhập nội dung bài học..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Video bài học</label>
                <input type="file" name="videoFile" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Tài liệu đính kèm</label>
                <input type="file" name="attachments" multiple class="form-input">
            </div>
        </div>
    </form>

    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h2 class="modal-title">Xác nhận xóa bài học</h2>
            <p>Bạn có chắc muốn xóa bài học <span id="deleteLessonName"></span>?</p>
            <div class="modal-actions">
                <a href="#" class="btn btn-secondary" onclick="hideDeleteModal()">Hủy</a>
                <a href="#" class="btn btn-danger" onclick="confirmDelete()">Xóa</a>
            </div>
        </div>
    </div>
</main>

<script>
    function showDeleteModal(lessonName) {
        document.getElementById('deleteLessonName').textContent = lessonName;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function hideDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    function confirmDelete() {
        alert('Bài học đã được xóa!');
        hideDeleteModal();
    }
</script>
</body>
</html>
