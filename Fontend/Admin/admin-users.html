<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users</title>
<link rel="stylesheet" href="Amin-User.css" />
</head>
<body>
    <div class="container">
        <h1>Admin Users</h1>

        <div class="user-profile">
            <img src="https://via.placeholder.com/50" alt="Admin Avatar">
            <div class="user-info">
                <div class="user-name" onclick="window.location.href='admin-profile.html'" style="cursor: pointer;">Admin Hannah</div>
                <div class="user-email">hannah@example.com</div>
            </div>
        </div>

        <div class="user-profile">
            <img src="https://via.placeholder.com/50" alt="User Avatar">
            <div class="user-info">
                <div class="user-name">John Doe</div>
                <div class="user-email">john.doe@example.com</div>
            </div>
        </div>

        <div class="user-profile">
            <img src="https://via.placeholder.com/50" alt="User Avatar">
            <div class="user-info">
                <div class="user-name">Jane Smith</div>
                <div class="user-email">jane.smith@example.com</div>
            </div>
        </div>

        <!-- More user profiles can be added here -->
    </div>
</body>
</html>
